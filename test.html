<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase Test</title>
<style>
  body { font-family: sans-serif; padding: 24px; background: #f0fdf4; }
  h2 { color: #059669; }
  .box { background: #fff; border: 1px solid #d1fae5; border-radius: 10px; padding: 16px; margin: 12px 0; font-size: 0.9rem; word-break: break-all; }
  .ok { border-color: #6ee7b7; background: #ecfdf5; color: #065f46; }
  .err { border-color: #fca5a5; background: #fef2f2; color: #b91c1c; }
  .pending { border-color: #fde68a; background: #fffbeb; color: #92400e; }
</style>
</head>
<body>
<h2>🔥 Naija Insights — Firebase Test</h2>
<div class="box pending" id="s1">⏳ Step 1: Loading Firebase SDK...</div>
<div class="box pending" id="s2">⏳ Step 2: Initializing app...</div>
<div class="box pending" id="s3">⏳ Step 3: Connecting to Firestore...</div>
<div class="box pending" id="s4">⏳ Step 4: Reading articles collection...</div>
<div class="box pending" id="s5">⏳ Step 5: Article count...</div>

<script type="module">
  const s = (id, msg, type) => {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = 'box ' + type;
  };

  try {
    s('s1', '✅ Step 1: Firebase SDK loaded', 'ok');

    import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js').then(({ initializeApp }) => {
      s('s2', '✅ Step 2: SDK import successful', 'ok');

      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js').then(({ getFirestore, collection, getDocs, query, orderBy, limit }) => {

        const firebaseConfig = {
          apiKey: "AIzaSyDCoc6cZeyK-QnRigxT9KSU9fk5kFAyCJc",
          authDomain: "naija-insights.firebaseapp.com",
          projectId: "naija-insights",
          storageBucket: "naija-insights.firebasestorage.app",
          messagingSenderId: "620443477759",
          appId: "1:620443477759:web:5ff1a76f4e0392532bceca"
        };

        try {
          const app = initializeApp(firebaseConfig, 'test-app');
          const db = getFirestore(app);
          s('s2', '✅ Step 2: Firebase app initialized', 'ok');
          s('s3', '✅ Step 3: Firestore connected', 'ok');

          const q = query(collection(db, 'articles'), orderBy('createdAt', 'desc'), limit(5));

          getDocs(q).then(snap => {
            s('s4', '✅ Step 4: Firestore query succeeded', 'ok');
            s('s5', `✅ Step 5: Found ${snap.size} article(s) — IDs: ${snap.docs.map(d => d.id).join(', ')}`, 'ok');
          }).catch(err => {
            s('s4', '✅ Step 4: Query ran', 'ok');
            s('s5', '❌ Step 5: Query error — ' + err.message, 'err');
          });

        } catch(e) {
          s('s2', '❌ Step 2: Init error — ' + e.message, 'err');
        }

      }).catch(e => {
        s('s3', '❌ Step 3: Firestore import failed — ' + e.message, 'err');
      });

    }).catch(e => {
      s('s1', '❌ Step 1: SDK import failed — ' + e.message, 'err');
    });

  } catch(e) {
    s('s1', '❌ Step 1: Fatal error — ' + e.message, 'err');
  }
</script>
</body>
</html>
